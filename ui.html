<style>
  html {
    overflow-y: scroll;
    scrollbar-gutter: stable;
  }

  body {
    font-family: Inter, sans-serif;
    margin: 0;
    padding: 12px 12px 48px;
    box-sizing: border-box;
    background-color: #ffffff;
  }

  /* --- NEW TABS STYLING --- */
 .tabs-container {
    display: flex;
    flex-wrap: nowrap;
    justify-content: space-between;
    gap: 0;
    width: 100%;
    margin-bottom: 20px;
  }

  .tab {
    background-color: #ffffff; /* White background */
    border: 1px solid #ffffff; /* Small outline */
    border-radius: 6px; /* Rounded corners */
    padding: 2px 1px;
    display: flex;
    flex: 0 0 auto;
    min-width: 0;
    align-items: center;
    justify-content: center;
    gap: 2px; /* Space between icon and name */
    cursor: pointer;
    transition: all 0.2s ease;
    color: #000000;
    font-size: 13px;
    line-height: 16px;
    font-weight: 500;
    opacity: 0.5;
    white-space: nowrap;
    /* text-decoration-line: underline;
    text-decoration-color: #25252549;
    text-underline-offset: 2px; */
  }

  /* Hover & Active states turn blue */
  .tab:hover {
    border-color: #ffffff;
    color: #000000;
    background-color: #ffffff;
    opacity: 0.8;
  }
  
  .tab.active {
    border-color: #ffffff;
    color: #6c2eff;
    background-color: #ffffff;
    text-decoration: none;
    opacity: 1;
  }

  /* SVG section icons inside the button */
  .tab svg {
    /* width: 14px; */
    height: 14px;
    stroke: currentColor; /* Inherits the text color so it turns blue too */
    fill: none;
    flex-shrink: 0;
  }

  .tab span.name {
    white-space: nowrap;
  }
  /* ------------------------ */

  h3 {
    margin-top: 0;
    font-size: 14px;
    font-weight: 600;
    color: #181818;
  }

  .donate-footer {
    --donate-color: #e72f57;
    position: fixed;
    right: 0;
    bottom: 0;
    left: 0;
    z-index: 10;
    height: 32px;
    box-sizing: border-box;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    background-color: #ffffff;
    font-size: 12px;
    font-weight: 400;
    color: var(--donate-color);
  }

  .donate-footer a {
    color: inherit;
    text-decoration: underline;
    text-decoration-color: color-mix(in srgb, var(--donate-color) 30%, transparent);
    text-underline-offset: 2px;
    cursor: pointer;
  }

  .donate-footer a:hover {
    opacity: 0.75;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
  }

  .svg-card {
    border: 1px solid #e5e5e5;
    border-radius: 4px;
    padding: 12px 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .svg-card:hover {
    background-color: #f5f5f5;
    border-color: #e5e5e5;
  }

  .svg-icon {
    width: 48px;  
    height: 48px; 
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .svg-icon svg {
    width: 100%;
    height: 100%;
  }

  /* Wide, edge-to-edge previews used only by the Palettes section */
  .grid.is-palettes {
    grid-template-columns: 1fr;
    width: 100%;
    margin: 0;
    gap: 12px;
  }

  .palette-description {
    position: relative;
    top: -3px;
    font-size: 16px;
    font-weight: 500;
    font-style: normal;
    line-height: 20px;
    color: #000000;
    opacity: 1;
  }

  .grid.is-palettes .svg-card {
    padding: 0;
    border: 0;
    border-radius: 0;
  }

  .grid.is-palettes .svg-card:hover {
    border: 0;
    background-color: transparent;
  }

  .grid.is-palettes .svg-icon {
    width: 100%;
    height: auto;
  }

  .grid.is-palettes .svg-icon svg {
    display: block;
    width: 100%;
    height: auto;
  }
</style>

  let activeCategory = 'all';

  // 3. RENDER THE TABS UI
  function renderTabs() {
    const tabsContainer = document.getElementById('tabs-container');
    tabsContainer.innerHTML = '';
    
    categories.forEach(cat => {
      const btn = document.createElement('div');
      // Highlight the tab if it is the currently selected one
      btn.className = 'tab' + (cat.id === activeCategory ? ' active' : '');
      
      // Inject icon and name
      btn.innerHTML = `
        ${cat.icon || ''}
        <span class="name">${cat.name}</span>
      `;

      // Update state and refresh UI on click
      btn.onclick = () => {
        activeCategory = cat.id;
        renderTabs();
        renderGrid();
      };

      tabsContainer.appendChild(btn);
    });
  }

  // 4. RENDER THE SVG GRID (FILTERED)
  function renderGrid() {
    const gridContainer = document.getElementById('svg-grid');
    gridContainer.classList.toggle('is-palettes', activeCategory === 'palettes');
    gridContainer.innerHTML = ''; // Clear previous

    if (activeCategory === 'palettes') {
      const description = document.createElement('div');
      description.className = 'palette-description';
      description.textContent = 'Safe colors for people with color blindness:';
      gridContainer.appendChild(description);
    }
    
    // Filter SVGs. If 'all' is selected, include everything.
    const filteredList = activeCategory === 'all' 
      ? svgList 
      : svgList.filter(item => item.category === activeCategory);

    // Loop through filtered list and generate UI cards
    filteredList.forEach(item => {
      const card = document.createElement('div');
      card.className = 'svg-card';
      card.innerHTML = `<div class="svg-icon">${item.code}</div>`;

      // Send the SVG code to code.ts on click
      card.onclick = () => {
        parent.postMessage({ 
          pluginMessage: {
            type: 'insert-svg',
            svgCode: item.code,
            name: item.name || 'SVG'
          }
        }, '*');
      };

      gridContainer.appendChild(card);
    });
  }

  // Initial load
  renderTabs();
  renderGrid();
</script>
